name: QA Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    # 러너 행(hang) 시 6시간 기본 한도 대신 빠른 실패로 드러나게 한다 (2026-07-31 행 사고 재발 대비)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run QA gate
        run: npm run qa

  e2e:
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

  workflow-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workflow dependencies
        run: npm ci --prefix workflow

      - name: Run workflow tests
        run: npm test --prefix workflow
